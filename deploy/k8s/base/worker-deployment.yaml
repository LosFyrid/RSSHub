apiVersion: apps/v1
kind: Deployment
metadata:
  name: rss-hub-worker
  labels:
    app.kubernetes.io/name: rss-hub
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rss-hub
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rss-hub
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/losfyrid/rsshub:latest
          imagePullPolicy: IfNotPresent
          args:
            - python
            - manage.py
            - async_worker
          envFrom:
            - configMapRef:
                name: rss-hub-config
            - secretRef:
                name: rss-hub-app-secrets
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rss-hub-db-auth
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rss-hub-redis-auth
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@rss-hub-redis:6379/0"
            - name: ASYNC_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@rss-hub-redis:6379/1"
            - name: RUN_INIT_ON_START
              value: "0"
            - name: RUN_COLLECTSTATIC_ON_START
              value: "0"
            - name: RUN_MAKEMIGRATIONS_ON_START
              value: "0"
            - name: RUN_MIGRATIONS_ON_START
              value: "0"
            - name: RUN_CREATE_SUPERUSER_ON_START
              value: "0"
            - name: RUN_COMPILEMESSAGES_ON_START
              value: "0"
            - name: ENABLE_CONTAINER_CRON
              value: "0"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
