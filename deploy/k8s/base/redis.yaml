apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: rss-hub-redis
  labels:
    app.kubernetes.io/name: rss-hub
    app.kubernetes.io/component: redis
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.15
    imagePullPolicy: IfNotPresent
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
    redisSecret:
      name: rss-hub-redis-auth
      key: password
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  redisConfig:
    additionalRedisConfig: rss-hub-redis-config
  storage:
    keepAfterDelete: false
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        storageClassName: longhorn
