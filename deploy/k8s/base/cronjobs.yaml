apiVersion: batch/v1
kind: CronJob
metadata:
  name: rss-hub-feed-updater-5min
  labels:
    app.kubernetes.io/name: rss-hub
    app.kubernetes.io/component: scheduler
spec:
  schedule: "*/5 * * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: feed-updater
              image: ghcr.io/losfyrid/rsshub:latest
              imagePullPolicy: IfNotPresent
              args: ["python", "manage.py", "feed_updater", "--frequency", "5 min"]
              envFrom:
                - configMapRef:
                    name: rss-hub-config
                - secretRef:
                    name: rss-hub-app-secrets
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rss-hub-db-auth
                      key: password
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rss-hub-redis-auth
                      key: password
                - name: REDIS_URL
                  value: "redis://:$(REDIS_PASSWORD)@rss-hub-redis:6379/0"
                - name: ASYNC_REDIS_URL
                  value: "redis://:$(REDIS_PASSWORD)@rss-hub-redis:6379/1"
                - name: RUN_INIT_ON_START
                  value: "0"
---
