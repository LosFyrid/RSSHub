apiVersion: apps/v1
kind: Deployment
metadata:
  name: rss-hub-web
  labels:
    app.kubernetes.io/name: rss-hub
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rss-hub
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rss-hub
        app.kubernetes.io/component: web
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/losfyrid/rsshub:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/entrypoint.sh
          args:
            - python
            - manage.py
            - migrate
            - --noinput
          envFrom:
            - configMapRef:
                name: rss-hub-config
            - secretRef:
                name: rss-hub-app-secrets
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rss-hub-db-auth
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rss-hub-redis-auth
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@rss-hub-redis:6379/0"
            - name: ASYNC_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@rss-hub-redis:6379/1"
            - name: RUN_INIT_ON_START
              value: "0"
            - name: WAIT_FOR_DB_ON_START
              value: "1"
            - name: WAIT_FOR_REDIS_ON_START
              value: "0"
      containers:
        - name: web
          image: ghcr.io/losfyrid/rsshub:latest
          imagePullPolicy: IfNotPresent
          args:
            - /opt/venv/bin/gunicorn
            - config.wsgi:application
            - --bind
            - 0.0.0.0:8000
            - --workers
            - "2"
            - --timeout
            - "120"
            - --keep-alive
            - "5"
            - --max-requests
            - "1000"
            - --max-requests-jitter
            - "100"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: rss-hub-config
            - secretRef:
                name: rss-hub-app-secrets
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rss-hub-db-auth
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rss-hub-redis-auth
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@rss-hub-redis:6379/0"
            - name: ASYNC_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@rss-hub-redis:6379/1"
            - name: RUN_INIT_ON_START
              value: "1"
            - name: RUN_COLLECTSTATIC_ON_START
              value: "1"
            - name: RUN_MAKEMIGRATIONS_ON_START
              value: "0"
            - name: RUN_MIGRATIONS_ON_START
              value: "0"
            - name: RUN_CREATE_SUPERUSER_ON_START
              value: "1"
            - name: RUN_COMPILEMESSAGES_ON_START
              value: "0"
            - name: ENABLE_CONTAINER_CRON
              value: "0"
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: rss-hub.pic-aichem.online
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: rss-hub.pic-aichem.online
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
